# Publishes the playground to https://birko-framework.github.io/Birko.Web.Playground/
#
# WHY THE CHECKS RUN BEFORE THE DEPLOY: this is the public face of Birko.Web, and a broken deploy is
# worse than a stale one -- a visitor who opens it and sees an empty gallery concludes the framework
# is broken, not the page. So the job builds, runs every harness, and only uploads if they all pass.
#
# subpath-check.mjs is the one that matters here and is easy to think redundant: verify.mjs serves
# wwwroot/ at the WEB ROOT, which is exactly the configuration that hides a subpath defect. All 667
# of its checks passed against a build whose service worker could not register at all on this URL.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time, and never cancel one halfway: a cancelled Pages deploy can leave
# the site mid-swap. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the playground
        uses: actions/checkout@v4
        with:
          path: Birko/Consumers/Birko.Web.Playground

      # build.js resolves the framework sources by walking up for a `Birko/Web` directory, or from
      # BIRKO_SRC. Checking out into the documented bucket layout means CI resolves it the same way a
      # developer's machine does, rather than through a CI-only override that could hide a layout
      # change.
      #
      # ⚠ The capital B matters. These paths were `birko/...` on the first run -- which is what the
      # framework's own .NET workflows use, and which works there because MSBuild resolves BirkoSrc
      # from an explicit property rather than by name. Here the walk-up looks for a directory
      # literally called `Birko/Web`, and the runner is Linux, so `birko/Web` is a different path:
      # the build failed with "Cannot locate Birko\Web" while the same layout works on Windows.
      - name: Check out Birko.Web (the sources the bundle is built from)
        uses: actions/checkout@v4
        with:
          repository: Birko-Framework/Birko.Web
          path: Birko/Web

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Birko/Consumers/Birko.Web.Playground/package-lock.json

      - name: Install
        working-directory: Birko/Consumers/Birko.Web.Playground
        run: npm ci

      # --release minifies and drops the source map: 1.0mb -> 672kb, and the 2.1mb map is not shipped.
      # Measured safe for these components -- every harness below also passes against the minified
      # bundle, which is not obvious, since minifying renames classes and custom elements are
      # name-sensitive in places.
      - name: Build (release)
        working-directory: Birko/Consumers/Birko.Web.Playground
        run: node build.js --release

      # PG_SKIP_FONT_METRIC_CHECKS excuses exactly one check whose outcome depends on glyph widths
      # rather than on the code -- see ENV_SENSITIVE in verify.mjs for the measurement. It fits 420px
      # on Windows and overshoots by 8px here, because the two platforms share no fonts. Everything
      # else in the suite still gates the deploy, and a local `node verify.mjs` is unaffected.
      - name: Gallery + component harness (667 checks)
        working-directory: Birko/Consumers/Birko.Web.Playground
        env:
          PG_SKIP_FONT_METRIC_CHECKS: '1'
        run: node verify.mjs

      # device-fix-check.mjs is deliberately NOT a gate here, and not because it is inconvenient: the
      # runner cannot satisfy its precondition. Its own guard reported
      # `pointer emulation actually flips the media query (coarse=true, fine=false)` -- headless Chrome
      # on ubuntu-latest has no pointing device, so `(pointer: fine)` matches nothing and a desktop
      # pointer cannot be represented at all. The harness says so itself, in a check whose comment
      # reads "without this guard the two checks below would both read a desktop pointer and the
      # coarse one would look like a broken fix rather than a broken harness."
      #
      # Running it anyway would gate the publish on 25 measurements the environment makes vacuous, and
      # running it with continue-on-error would be worse -- a check nobody fails is not a check. It
      # covers component behaviour under touch, which belongs in Birko.Web's own CI on a platform that
      # can emulate a pointer, not in the gate for whether this page is correct.

      - name: Subpath harness — the one that proves THIS deploy works
        working-directory: Birko/Consumers/Birko.Web.Playground
        run: node subpath-check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Birko/Consumers/Birko.Web.Playground/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
